<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Come find new places to see in other countries!">
    <link rel="stylesheet" href="style.css">
    <title>Places To Visit</title>
</head>
<body>

    <header>
        <h1 class="title">Places To Visit</h1>
    </header>

    <main>
        <div class="country-select-container">
            <select class="country-select" id="CountrySelect">
                <option value="portugal">Portugal</option>
                <option selected value="portugal">USA</option>
            </select>
        </div>

        <div class="places-grid">

            <div class="place-card">
                <img src="https://s5.static.brasilescola.uol.com.br/be/2023/02/estatua-liberdade-mulher.jpg" alt="" class="place-img">
                <p class="place-name">Statue of Liberty</p>
                <p class="place-description">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorum esse architecto voluptatem itaque quis. Ab, est saepe tenetur obcaecati tempora accusantium laborum aperiam odit et excepturi voluptas provident dolore error?</p>
            </div>

        </div>
    </main>
    
</body>
</html>
